name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/ -v
      # A push straight to main previously ran no conformance test at all.
      - run: uv run pytest -m mongo -q
      - run: uv run ruff check src/
      - run: uv run mypy src/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.CRAWLER_DEPLOY_PATH }}

            PREV_COMMIT=$(git rev-parse HEAD)
            git pull origin main

            cd py
            docker compose build

            rollback() {
              echo "Deploy failed — rolling back to $PREV_COMMIT"
              cd ${{ secrets.CRAWLER_DEPLOY_PATH }}
              git reset --hard "$PREV_COMMIT"
              cd py
              docker compose build
              docker compose up -d
            }

            docker compose up -d
            sleep 10
            docker compose ps crawler --format '{{.State}}' | grep -q running || { rollback; exit 1; }

            # "Did not crash" is not enough once plugins are optional: an image
            # built without the mongo extra boots, logs cleanly, writes nothing,
            # and passes the check above (plan 위험 ⑤). Assert it actually
            # assembled the store instead.
            LOGS=$(docker compose logs crawler --since 60s)
            echo "$LOGS" | grep -q 'active_plugins' || { echo "no active_plugins log"; rollback; exit 1; }
            echo "$LOGS" | grep 'active_plugins' | grep -q 'mongo' || { echo "mongo plugin absent"; rollback; exit 1; }
