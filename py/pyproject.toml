[project]
name = "skkuverse-crawler"
# 0.x, and deliberately a step DOWN from the 1.0.0 that sat here since the
# initial commit and was never a claim anyone made. adr-006 §⑬ gates 1.0
# on a second module actually running on this framework — an abstraction
# with one consumer is an untested guess. Until then the event vocabulary
# is only provisionally frozen, which is a promise 1.0 would forbid.
# Nothing is published yet, so this correction is free today and
# impossible after the first release. Pinned by test_packaging.
version = "0.1.0"
description = "SKKU 관련 데이터 크롤링 + 콘텐츠 정제 서비스"
# `readme` is deliberately unset: README.md lives at the repo root and the
# build root is py/, which PEP 621 will not let a readme path escape. No
# publish workflow exists to serve it either, so this waits for the
# release decision that would need it.
requires-python = ">=3.12"
# Base = what a crawl needs with no infrastructure: fetch, parse, clean,
# and a CLI to drive it. Everything an adapter needs is an extra below.
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # NEVER imported — used only as a parser NAME, BeautifulSoup(raw, "lxml").
    # Moving it to an extra keeps every import/structure test green and fails
    # at crawl time with FeatureNotFound. Pinned by test_packaging.py.
    "lxml>=5.0",
    "nh3>=0.2",
    "markdownify>=1.2",
    "imagesize>=1.4",
    "structlog>=24.0",
    # click backs [project.scripts]; python-dotenv backs env.py. A core-only
    # install that cannot produce a working binary would make the acceptance
    # gate unsatisfiable, so these stay base (architecture §56 argued the
    # opposite — rejection recorded there).
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# pymongo/bson/dnspython arrive transitively under motor — naming them here
# would let their floors drift out of motor's own pymongo pin.
mongo = ["motor>=3.6"]
sched = ["apscheduler>=3.10,<4"]
discord = ["tenacity>=9.0"]
# tenacity is duplicated, not hoisted to base: plugins/discord and
# plugins/dispatch each need it independently. dispatch has no extra of its
# own because it is reachable only through ai_summary (adr-006 hard-edge
# inventory records that single logic edge), so it rides in `ai`.
ai = ["tenacity>=9.0"]
all = ["skkuverse-crawler[mongo,sched,discord,ai]"]
# Must include `all`: both workflows run `uv sync --extra dev` and nothing
# else, so without this the CI environment would have no motor.
dev = [
    "skkuverse-crawler[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[mongodb]>=4.0",
]

[project.scripts]
skkuverse-crawler = "skkuverse_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skkuverse_crawler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mongo: requires real MongoDB (Docker via testcontainers, or MONGO_TEST_URL)",
]
addopts = "-m 'not mongo'"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
